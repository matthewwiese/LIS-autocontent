# Expected file contents per collection type, for resolving the file list of a
# collection that publishes no CHECKSUM.
#
# SOURCE OF TRUTH: github.com/legumeinfo/datastore-specifications, whose template tree
# documents one Markdown file per content type at Genus/species/<type>/<content>.md.
# This file is a vendored copy so a catalog build needs no network to know the
# vocabulary; `tests/test_filetypes.py` guards it against drift.
#
# Why this exists: roughly 45% of collections publish no CHECKSUM (nearly every qtl,
# gwas and maps one), and CHECKSUM is the only enumeration that lists a collection's
# files. Without this, those collections are catalogued with an empty file list and are
# effectively unreachable. With it, filenames are constructed from the documented
# convention and (with --verify) confirmed against the store.
#
# Measured against 23 live collections: 57 files correctly predicted, 12 predicted but
# absent, 2 that existed and were not predicted (one .webp figure, one collection whose
# filename id disagrees with its directory name). Prediction is therefore a good default
# and a poor guarantee -- which is why every predicted file is labelled `src` in the
# catalog and never presented as authoritative.
#
# Shape of each entry:
#   prefix    abbrev = "<scientific_name_abbrev>.<identifier>."  (the common case)
#             none   = "<identifier>."                           (genus/family-scoped sets)
#   contents  the documented content types
#   extension appended to "<prefix><content>"
#   indexed   false = this type never publishes .fai/.tbi siblings, so index status can
#             be resolved without probing for them (verified: 72 probes, 0 hits across
#             qtl/gwas/maps). Omit when indexes are possible.
#   predictable: false = filenames are arbitrary; never guess.

qtl:
  prefix: abbrev
  contents: [obo, qtl, qtlmrk, trait]
  extension: .tsv.gz
  indexed: false

gwas:
  prefix: abbrev
  contents: [obo, result, trait]
  extension: .tsv.gz
  indexed: false

maps:
  prefix: abbrev
  contents: [lg, mrk]
  extension: .tsv.gz
  indexed: false

mstmap:
  prefix: abbrev
  contents: [mstmap]
  extension: .tsv.gz
  indexed: false

markers:
  prefix: abbrev
  contents: [gff3]
  extension: .gz

pangenes:
  # Genus-scoped: files are "Cicer.pan2.CMWZ.clust.tsv.gz", with no abbrev prefix.
  prefix: none
  contents: [clust, hsh, counts]
  extension: .tsv.gz

genefamilies:
  # Family-scoped, e.g. "legume.fam1.M65K.*". Most members are tarballs rather than
  # per-content tables, so only the tabular ones are listed here.
  prefix: none
  contents: [info_annot_ahrd]
  extension: .tsv.gz

supplements:
  # Deliberately not predicted: supplementary files carry study-specific names
  # (SNP_names.txt, batch_R_commands.tar.gz, ...) with no convention to follow.
  predictable: false
