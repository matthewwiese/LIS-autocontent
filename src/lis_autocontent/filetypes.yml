# Expected files per collection type, for collections that publish no CHECKSUM.
# Vendored from datastore-specifications (Genus/species/<type>/<content>.md);
# tests/test_filetypes.py guards it against drift. Predictions are labelled `src`,
# never authoritative.
#
#   prefix       abbrev = "<scientific_name_abbrev>.<identifier>."
#                none   = "<identifier>."
#   contents     the documented content types
#   extension    appended to "<prefix><content>"
#   indexed      false = never publishes .fai/.tbi siblings, so none are probed
#   predictable  false = filenames are arbitrary; never guess

qtl:
  prefix: abbrev
  contents: [obo, qtl, qtlmrk, trait]
  extension: .tsv.gz
  indexed: false

gwas:
  prefix: abbrev
  contents: [obo, result, trait]
  extension: .tsv.gz
  indexed: false

maps:
  prefix: abbrev
  contents: [lg, mrk]
  extension: .tsv.gz
  indexed: false

mstmap:
  prefix: abbrev
  contents: [mstmap]
  extension: .tsv.gz
  indexed: false

markers:
  prefix: abbrev
  contents: [gff3]
  extension: .gz

pangenes:
  # Genus-scoped: files are "Cicer.pan2.CMWZ.clust.tsv.gz", with no abbrev prefix.
  prefix: none
  contents: [clust, hsh, counts]
  extension: .tsv.gz

genefamilies:
  # Family-scoped, e.g. "legume.fam1.M65K.*". Most members are tarballs rather than
  # per-content tables, so only the tabular ones are listed here.
  prefix: none
  contents: [info_annot_ahrd]
  extension: .tsv.gz

supplements:
  # Deliberately not predicted: supplementary files carry study-specific names
  # (SNP_names.txt, batch_R_commands.tar.gz, ...) with no convention to follow.
  predictable: false
