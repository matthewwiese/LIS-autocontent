# Instances for `lis-autocontent populate-gcv`, each a gcv-docker-compose deployment.
#
# members: annotation collections, loaded in the order given. An entry
# {path, rename_chromosomes: true} loads onto chromosomes named gnmN.annM instead of
# gnmN, so that a second annotation of one assembly gets distinct chromosomes.
# family: the family file each member loads, <prefix>.<family>.<key>.gfa.tsv.gz.

# The gcv-docker-compose release whose gcvctl runs these instances.
template: v2.7.0-c0

# Every instance's .env, before its own env. DOMAIN is the public host: requests reach
# the instances only with it as their Host header.
env:
  DOMAIN: gcv-microservices.lis.ncgr.org
  REDIS_START_PERIOD: 120s

