name: Populate catalog

# Builds catalog.json for the whole datastore from the current datastore-metadata main,
# publishes it as a GitHub release asset, then POSTs where to find it to the endpoint in
# the WEBHOOK_URL repository variable.
#
# Trigger it from the Actions tab, or from another repository's workflow, e.g.
#   gh workflow run populate-catalog.yml --repo legumeinfo/LIS-autocontent
# Dispatching from another repository needs a token with actions:write here; that
# repository's own GITHUB_TOKEN cannot reach this one. The workflow has to exist on the
# default branch to be dispatchable, and runs against whichever ref the dispatch names.

on:
  workflow_dispatch:

# contents: write is what lets the run create a release; reading the repository alone
# is not enough.
permissions:
  contents: write

concurrency:
  group: populate-catalog

defaults:
  run:
    shell: bash

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out datastore-metadata
        uses: actions/checkout@v7
        with:
          repository: legumeinfo/datastore-metadata
          path: datastore-metadata

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lis-autocontent
        run: pip install .

      # Offline, so the same datastore-metadata commit always gives the same catalog.
      # --verify would HEAD-check the files predicted for collections without a CHECKSUM,
      # but a probe that fails for any reason reads as "file absent" and drops the file.
      - name: Build catalog.json
        id: build
        run: |
          lis-autocontent populate-catalog \
            --from_github datastore-metadata \
            --catalog_out catalog/catalog.json \
            --log_file populate-catalog.log
          {
            echo "datastore_commit=$(git -C datastore-metadata rev-parse HEAD)"
            echo "datastore_short=$(git -C datastore-metadata rev-parse --short HEAD)"
            echo "sha256=$(sha256sum catalog/catalog.json | cut -d' ' -f1)"
            echo "size=$(stat -c%s catalog/catalog.json)"
          } >> "$GITHUB_OUTPUT"

      # One release per run, tagged with the build time and the datastore-metadata commit
      # that determined the content, so any past catalog stays fetchable at its own tag.
      # Seconds are in the tag because a re-run against the same commit must not collide:
      # gh release create fails on an existing tag rather than overwriting one.
      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DATASTORE_COMMIT: ${{ steps.build.outputs.datastore_commit }}
          DATASTORE_SHORT: ${{ steps.build.outputs.datastore_short }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          SIZE: ${{ steps.build.outputs.size }}
        run: |
          tag="catalog-$(date -u +%Y%m%d-%H%M%S)-$DATASTORE_SHORT"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > release-notes.md <<EOF
          Catalog of the whole LIS datastore, built offline by \`populate-catalog\`.

          | | |
          | --- | --- |
          | datastore-metadata | [\`$DATASTORE_SHORT\`](https://github.com/legumeinfo/datastore-metadata/commit/$DATASTORE_COMMIT) |
          | lis-autocontent | [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |
          | built by | [run $GITHUB_RUN_ID]($run_url) |
          | catalog.json | $SIZE bytes, sha256 \`$SHA256\` |

          The newest catalog is always at
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/catalog.json
          EOF
          # --latest keeps that stable URL pointing at this build.
          gh release create "$tag" catalog/catalog.json \
            --title "Catalog $(date -u +%Y-%m-%d) (datastore-metadata $DATASTORE_SHORT)" \
            --notes-file release-notes.md \
            --latest
          {
            echo "tag=$tag"
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo "download_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/catalog.json"
            echo "latest_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/catalog.json"
          } >> "$GITHUB_OUTPUT"

      # Unlike a workflow artifact, a release asset downloads without authentication, so
      # download_url is usable by any receiver on a public repository.
      - name: Notify webhook
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL || 'https://example.com' }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          LATEST_URL: ${{ steps.release.outputs.latest_url }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          SIZE: ${{ steps.build.outputs.size }}
          DATASTORE_COMMIT: ${{ steps.build.outputs.datastore_commit }}
        run: |
          payload=$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg datastore_commit "$DATASTORE_COMMIT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg latest_url "$LATEST_URL" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            '{
              event: "catalog-built",
              repository: $repository,
              commit: $commit,
              datastore_metadata_commit: $datastore_commit,
              run_url: $run_url,
              release: {
                tag: $tag,
                url: $release_url,
                asset: {
                  name: "catalog.json",
                  download_url: $download_url,
                  latest_download_url: $latest_url,
                  size: $size,
                  sha256: $sha256
                }
              }
            }')
          headers=(
            -H "Content-Type: application/json"
            -H "User-Agent: lis-autocontent-populate-catalog"
          )
          if [ -n "$WEBHOOK_SECRET" ]; then
            # Signed like GitHub's own webhooks: HMAC-SHA256 of the exact body sent.
            signature=$(printf '%s' "$payload" | python3 -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environ["WEBHOOK_SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
            headers+=(-H "X-Hub-Signature-256: sha256=$signature")
          fi
          echo "$payload" | jq .
          # Any non-2xx response fails the run, so a missed notification is visible. The
          # release is already published by this point and stays published either way.
          # Only transient failures (timeouts, refused connections, 408/429/5xx) are
          # retried; a rejection such as 405 won't change on a second attempt.
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-connrefused \
            -X POST "${headers[@]}" --data-binary "$payload" "$WEBHOOK_URL"
