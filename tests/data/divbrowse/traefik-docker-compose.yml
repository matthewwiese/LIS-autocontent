# Divbrowse Docker Compose
#
# Just run: docker compose up -d
#
# On first start, each Divbrowse service will automatically:
#   1. Download VCF and GFF3 from the specified URLs
#   2. Convert VCF to Zarr format
#   3. Generate configuration
#   4. Start the server
#
# Data is persisted in ./data/<name>/ directories.
#
# Routing: the `proxy` service (Traefik) listens on PROXY_PORT (default 8080)
# and routes http://<divbrowse.host>/<divbrowse.path>/ to each Divbrowse
# service, based on the two labels set on it. To add a dataset, add a service
# using the x-divbrowse template with those labels, then `docker compose up -d`.
# Per-host root redirects live in traefik/dynamic/divbrowse.yml.

x-divbrowse: &divbrowse
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  proxy:
    image: traefik:v3
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      # Rootless Docker: set DOCKER_SOCK=$XDG_RUNTIME_DIR/docker.sock
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
    restart: unless-stopped

  divbrowse-gnm4:
    <<: *divbrowse
    environment:
      - VCF_URL=https://data.legumeinfo.org/Glycine/max/diversity/Wm82.gnm4.div.Song_Hyten_2015/glyma.Wm82.gnm4.div.Song_Hyten_2015.vcf.gz
      - GFF3_URL=https://data.legumeinfo.org/Glycine/max/annotations/Wm82.gnm4.ann1.T8TQ/glyma.Wm82.gnm4.ann1.T8TQ.gene_models_main.gff3.gz
      - CHROM_PATTERN=glyma\.Wm82\.gnm4\.Gm[0-9]+
    labels:
      divbrowse.host: divbrowse.soybase.org
      divbrowse.path: Wm82.gnm4.div.Song_Hyten_2015
    volumes:
      - ./data/gnm4:/opt/divbrowse

  divbrowse-gnm5:
    <<: *divbrowse
    environment:
      - VCF_URL=https://data.legumeinfo.org/Glycine/max/diversity/Wm82.gnm5.div.Song_Hyten_2015/glyma.Wm82.gnm5.div.Song_Hyten_2015.vcf.gz
      - GFF3_URL=https://data.legumeinfo.org/Glycine/max/annotations/Wm82.gnm5.ann1.J7HW/glyma.Wm82.gnm5.ann1.J7HW.gene_models_main.gff3.gz
      - CHROM_PATTERN=glyma\.Wm82\.gnm5\.Chr[0-9]+
    labels:
      divbrowse.host: divbrowse.soybase.org
      divbrowse.path: Wm82.gnm5.div.Song_Hyten_2015
    volumes:
      - ./data/gnm5:/opt/divbrowse

  divbrowse-gnm6:
    <<: *divbrowse
    environment:
      - VCF_URL=https://data.legumeinfo.org/Glycine/max/diversity/Wm82.gnm6.div.Song_Hyten_2015/glyma.Wm82.gnm6.div.Song_Hyten_2015.vcf.gz
      - GFF3_URL=https://data.legumeinfo.org/Glycine/max/annotations/Wm82.gnm6.ann1.PKSW/glyma.Wm82.gnm6.ann1.PKSW.gene_models_main.gff3.gz
      - CHROM_PATTERN=glyma\.Wm82\.gnm6\.Gm[0-9]+
    labels:
      divbrowse.host: divbrowse.soybase.org
      divbrowse.path: Wm82.gnm6.div.Song_Hyten_2015
    volumes:
      - ./data/gnm6:/opt/divbrowse

  # Peanut (Arachis hypogaea) diversity data are called against a combined
  # reference of the diploid progenitors: A. duranensis V14167 (A subgenome)
  # plus A. ipaensis K30076 (B subgenome), hence the two GFF3 files.
  divbrowse-arahy-otyama-kulkarni-2020:
    <<: *divbrowse
    environment:
      - VCF_URL=https://data.legumeinfo.org/Arachis/hypogaea/diversity/aradu1_araip1.gnm1.div.Otyama_Kulkarni_2020/aradu1_araip1.gnm1.div.Otyama_Kulkarni_2020.main.vcf.gz
      - GFF3_URL=https://data.legumeinfo.org/Arachis/duranensis/annotations/V14167.gnm1.ann1.cxSM/aradu.V14167.gnm1.ann1.cxSM.gene_models_main.gff3.gz https://data.legumeinfo.org/Arachis/ipaensis/annotations/K30076.gnm1.ann1.J37m/araip.K30076.gnm1.ann1.J37m.gene_models_main.gff3.gz
      - CHROM_PATTERN=^(aradu\.V14167\.gnm1\.Aradu\.A|araip\.K30076\.gnm1\.Araip\.B)[0-9]+$$
    labels:
      divbrowse.host: divbrowse.peanutbase.org
      divbrowse.path: aradu1_araip1.gnm1.div.Otyama_Kulkarni_2020
    volumes:
      - ./data/arahy-otyama-kulkarni-2020:/opt/divbrowse

  divbrowse-arahy-otyama-wilkey-2019:
    <<: *divbrowse
    environment:
      - VCF_URL=https://data.legumeinfo.org/Arachis/hypogaea/diversity/aradu1_araip1.gnm1.div.Otyama_Wilkey_2019/arahy.aradu1_araip1.gnm1.div.Otyama_Wilkey_2019.snp_chip.vcf.gz
      - GFF3_URL=https://data.legumeinfo.org/Arachis/duranensis/annotations/V14167.gnm1.ann1.cxSM/aradu.V14167.gnm1.ann1.cxSM.gene_models_main.gff3.gz https://data.legumeinfo.org/Arachis/ipaensis/annotations/K30076.gnm1.ann1.J37m/araip.K30076.gnm1.ann1.J37m.gene_models_main.gff3.gz
      - CHROM_PATTERN=^(aradu\.V14167\.gnm1\.Aradu\.A|araip\.K30076\.gnm1\.Araip\.B)[0-9]+$$
    labels:
      divbrowse.host: divbrowse.peanutbase.org
      divbrowse.path: aradu1_araip1.gnm1.div.Otyama_Wilkey_2019
    volumes:
      - ./data/arahy-otyama-wilkey-2019:/opt/divbrowse

  divbrowse-arahy-clevenger-korani-2018:
    <<: *divbrowse
    environment:
      - VCF_URL=https://data.legumeinfo.org/Arachis/hypogaea/diversity/aradu1_araip1.gnm1.div.Clevenger_Korani_2018/aradu1_araip1.gnm1.div.Clevenger_Korani_2018.snp_chip.vcf.gz
      - GFF3_URL=https://data.legumeinfo.org/Arachis/duranensis/annotations/V14167.gnm1.ann1.cxSM/aradu.V14167.gnm1.ann1.cxSM.gene_models_main.gff3.gz https://data.legumeinfo.org/Arachis/ipaensis/annotations/K30076.gnm1.ann1.J37m/araip.K30076.gnm1.ann1.J37m.gene_models_main.gff3.gz
      - CHROM_PATTERN=^(aradu\.V14167\.gnm1\.Aradu\.A|araip\.K30076\.gnm1\.Araip\.B)[0-9]+$$
    labels:
      divbrowse.host: divbrowse.peanutbase.org
      divbrowse.path: aradu1_araip1.gnm1.div.Clevenger_Korani_2018
    volumes:
      - ./data/arahy-clevenger-korani-2018:/opt/divbrowse
